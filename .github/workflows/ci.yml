name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run --filter openauthster-shared test
      - run: bun test --preload ./tests/wasm-preload.ts tests/endpoints-shared.test.ts tests/upgrade-flow.test.ts tests/sandbox.test.ts
        working-directory: apps/issuer
